<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Assignment 8 - Event Handling</title><style>body{font-family:Arial;margin:0;padding:24px;text-align:center}.container{max-width:650px;margin:auto}.box{margin:20px auto;padding:30px;border:1px solid #000;max-width:500px;background:#fff}input{display:block;width:80%;margin:10px auto;padding:9px;box-sizing:border-box;background:#fff;border:1px solid #000}#mouseBox{transition:background-color .2s}#nameInput{transition:background-color .2s}</style></head><body><main class="container"><h1>JavaScript Event Handling</h1><div id="mouseBox" class="box"><h2>Mouse Over Event</h2><p>Move the mouse over this box and move it away.</p></div><div class="box"><h2>Focus and Blur Events</h2><input id="nameInput" placeholder="Click and type your name"><p id="message"></p></div></main><script>mouseBox.addEventListener('mouseover',()=>{mouseBox.style.backgroundColor='lightblue';mouseBox.querySelector('p').textContent='Mouse is over the box.'});mouseBox.addEventListener('mouseout',()=>{mouseBox.style.backgroundColor='white';mouseBox.querySelector('p').textContent='Mouse left the box.'});nameInput.addEventListener('focus',()=>{nameInput.style.backgroundColor='lightyellow';message.textContent='The input has focus.'});nameInput.addEventListener('blur',()=>{nameInput.style.backgroundColor='white';message.textContent='The input lost focus.'});</script></body></html>
