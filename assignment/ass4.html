<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Assignment 4 - String Comparison</title><style>body{font-family:Arial,sans-serif;margin:0;padding:24px;text-align:center}.container{max-width:500px;margin:0 auto}input,button{display:block;width:90%;margin:10px auto;padding:9px;box-sizing:border-box;background:#fff;border:1px solid #000}button{cursor:pointer}#result{min-height:24px}</style></head><body><main class="container"><h1>String Comparison</h1><input id="first" placeholder="First string"><input id="second" placeholder="Second string"><button onclick="strictEqual()">Strict Equality</button><button onclick="compareLength()">Compare Length</button><button onclick="localeCompareStrings()">Locale Compare</button><button onclick="resetComparison()">Reset</button><p id="result"></p></main><script>function inputs(){return [first.value,second.value]}function valid(){if(first.value===''||second.value===''){result.textContent='Enter both strings.';return false}return true}function strictEqual(){if(valid())result.textContent=inputs()[0]===inputs()[1]?'The strings are strictly equal.':'The strings are not strictly equal.'}function compareLength(){if(valid())result.textContent=inputs()[0].length===inputs()[1].length?'Both strings have the same length.':'The strings have different lengths.'}function localeCompareStrings(){if(valid()){const n=first.value.localeCompare(second.value);result.textContent=n===0?'The strings are equal.':n<0?'The first string comes before the second.':'The first string comes after the second.'}}function resetComparison(){first.value='';second.value='';result.textContent=''}</script></body></html>
