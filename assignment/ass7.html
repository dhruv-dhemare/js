<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Assignment 7 - Array and Object Operations</title><style>body{font-family:Arial;margin:0;padding:24px;text-align:center}.container{max-width:1000px;margin:auto}.card{display:inline-block;vertical-align:top;width:450px;margin:8px;padding:16px;border:1px solid #000;box-sizing:border-box}input,button{display:block;width:90%;margin:8px auto;padding:8px;box-sizing:border-box;background:#fff;border:1px solid #000}button{cursor:pointer}.result{min-height:30px;word-wrap:break-word}.info{min-height:20px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #000;padding:7px;word-break:break-word}th{font-weight:bold}</style></head><body><main class="container"><h1>Array and Object Operations</h1><section class="card"><h2>Using Standard Methods</h2><input id="standardElement" placeholder="Element or array, e.g. [3,4,5]"><input id="standardKey" placeholder="Object key"><input id="standardObjectValue" placeholder="Object value"><button onclick="addElement('standard')">Add Element</button><button onclick="addObject('standard')">Append Object</button><button onclick="popItem('standard')">Pop</button><button onclick="check('standard')">Check Array</button><button onclick="resetData('standard')">Reset</button><p id="standardResult" class="result">[ ]</p><p id="standardInfo" class="info"></p><table id="standardTable"><thead><tr><th>Index</th><th>Element</th><th>Data Type</th><th>Is Array?</th></tr></thead><tbody></tbody></table></section><section class="card"><h2>Without Standard Methods</h2><input id="manualElement" placeholder="Element or array, e.g. [3,4,5]"><input id="manualKey" placeholder="Object key"><input id="manualObjectValue" placeholder="Object value"><button onclick="addElement('manual')">Add Element</button><button onclick="addObject('manual')">Append Object</button><button onclick="popItem('manual')">Remove Last</button><button onclick="check('manual')">Check Array</button><button onclick="resetData('manual')">Reset</button><p id="manualResult" class="result">[ ]</p><p id="manualInfo" class="info"></p><table id="manualTable"><thead><tr><th>Index</th><th>Element</th><th>Data Type</th><th>Is Array?</th></tr></thead><tbody></tbody></table></section></main><script>let standard=[],manual=[];function data(p){return p==='standard'?standard:manual}function render(p){document.getElementById(p+'Result').textContent=JSON.stringify(data(p))}function parseElement(text){const value=text.trim();if(value.startsWith('[')&&value.endsWith(']')){try{const parsed=JSON.parse(value);if(Array.isArray(parsed))return parsed}catch(error){}}return value}function addElement(p){const input=document.getElementById(p+'Element');if(input.value.trim())data(p).push(parseElement(input.value));input.value='';render(p)}function addObject(p){const k=document.getElementById(p+'Key').value,v=document.getElementById(p+'ObjectValue').value;if(k)data(p).push({[k]:v});render(p)}function popItem(p){data(p).pop();render(p)}function check(p){const a=data(p),body=document.querySelector('#'+p+'Table tbody');body.innerHTML='';a.forEach((item,index)=>{const row=body.insertRow();row.insertCell().textContent=index;row.insertCell().textContent=JSON.stringify(item);row.insertCell().textContent=typeof item;row.insertCell().textContent=Array.isArray(item)});document.getElementById(p+'Info').textContent=a.length+' item(s).'}function resetData(p){if(p==='standard')standard=[];else manual=[];[p+'Element',p+'Key',p+'ObjectValue'].forEach(id=>document.getElementById(id).value='');document.getElementById(p+'Info').textContent='';document.querySelector('#'+p+'Table tbody').innerHTML='';render(p)}</script></body></html>
