<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Assignment 6 - Array Operations</title><style>body{font-family:Arial;margin:0;padding:24px;text-align:center}.container{max-width:850px;margin:auto}.card{display:inline-block;vertical-align:top;width:340px;margin:8px;padding:16px;border:1px solid #000;box-sizing:border-box}input,button{display:block;width:90%;margin:9px auto;padding:8px;box-sizing:border-box;background:#fff;border:1px solid #000}button{cursor:pointer}.result{min-height:24px;word-wrap:break-word}</style></head><body><main class="container"><h1>Array Operations</h1><section class="card"><h2>Using Standard Methods</h2><input id="standardValue" placeholder="Enter an element"><button onclick="add('standard')">Add</button><button onclick="removeLast('standard')">Pop</button><button onclick="removeFirst('standard')">Shift</button><button onclick="addFirst('standard')">Unshift</button><button onclick="resetArray('standard')">Reset</button><p id="standardResult" class="result">[ ]</p></section><section class="card"><h2>Without Standard Methods</h2><input id="manualValue" placeholder="Enter an element"><button onclick="add('manual')">Add</button><button onclick="removeLast('manual')">Remove Last</button><button onclick="removeFirst('manual')">Remove First</button><button onclick="addFirst('manual')">Add First</button><button onclick="resetArray('manual')">Reset</button><p id="manualResult" class="result">[ ]</p></section></main><script>let standard=[],manual=[];function arr(p){return p==='standard'?standard:manual}function render(p){document.getElementById(p+'Result').textContent=JSON.stringify(arr(p))}function value(p){return document.getElementById(p+'Value').value}function add(p){const v=value(p);if(v)arr(p).push(v);render(p)}function addFirst(p){const v=value(p);if(v)arr(p).unshift(v);render(p)}function removeLast(p){arr(p).pop();render(p)}function removeFirst(p){arr(p).shift();render(p)}function resetArray(p){if(p==='standard')standard=[];else manual=[];document.getElementById(p+'Value').value='';render(p)}</script></body></html>
