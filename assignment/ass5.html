<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Assignment 5 - Countdown Timer</title><style>body{font-family:Arial,sans-serif;margin:0;padding:24px;text-align:center}.container{max-width:500px;margin:0 auto}input,button{display:block;width:90%;margin:10px auto;padding:9px;box-sizing:border-box;background:#fff;border:1px solid #000}button{cursor:pointer}#output{font-size:24px;min-height:30px}</style></head><body><main class="container"><h1>Countdown Timer</h1><label for="targetDate">Select date and time:</label><input id="targetDate" type="datetime-local"><button onclick="startTimer()">Start Countdown</button><button onclick="stopTimer()">Stop</button><button onclick="resetTimer()">Reset</button><p id="output">00 days, 00:00:00</p></main><script>let timer=null;let targetTime=0;function updateDisplay(){const difference=targetTime-Date.now();if(difference<=0){output.textContent='Time is up.';stopTimer();return}const totalSeconds=Math.floor(difference/1000),days=Math.floor(totalSeconds/86400),hours=Math.floor(totalSeconds%86400/3600),minutes=Math.floor(totalSeconds%3600/60),seconds=totalSeconds%60;output.textContent=days+' days, '+String(hours).padStart(2,'0')+':'+String(minutes).padStart(2,'0')+':'+String(seconds).padStart(2,'0')}function startTimer(){const selected=targetDate.value;if(!selected){output.textContent='Select a date and time.';return}targetTime=new Date(selected).getTime();if(targetTime<=Date.now()){output.textContent='Select a future date and time.';return}stopTimer();updateDisplay();timer=setInterval(updateDisplay,1000)}function stopTimer(){if(timer){clearInterval(timer);timer=null}}function resetTimer(){stopTimer();targetTime=0;targetDate.value='';output.textContent='00 days, 00:00:00'}</script></body></html>
